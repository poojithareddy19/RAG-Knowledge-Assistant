[project]
name = "floatchat"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# This repository has a src/mcp/ package and also depends on the installed
# `mcp` library. Newer ruff infers `mcp` is first-party from the directory
# name and splits the import block, which is both wrong and unstable across
# ruff versions. Naming it settles the question.
known-third-party = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs a running PostgreSQL",
    "llm: needs a running Ollama",
]
