[project]
name = "floatchat"
version = "0.2.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The scripts put the repository on sys.path before importing src, so that
# `python scripts/x.py` works from a plain checkout. That line has to come
# before the imports, which is exactly what E402 forbids.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs a running PostgreSQL",
    "llm: needs a running Ollama",
]
