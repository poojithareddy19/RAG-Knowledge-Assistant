# ============================================================================
# FloatChat: RAG conversational interface for ARGO ocean data. Central configuration.
# ----------------------------------------------------------------------------
# Anything that changes system behaviour lives here.
# Secrets (API keys) belong in .env.
# ============================================================================

app:
  name: "FloatChat"
  version: "0.3.0"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  log_dir: "logs"

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  normalize: true
  batch_size: 32
  device: "cpu"

generation:
  provider: "ollama"
  model: "llama3.1:latest"
  temperature: 0.0
  max_tokens: 700
  expose_prompt: true

router:
  enabled: true
  model: "llama3.1:latest"
  # Where a question goes when neither the rules nor the model can place it.
  # The summaries path declines when nothing is close enough, so an unplaced
  # question ends in a refusal rather than in SQL written against a guess.
  fallback: "summaries"

multilingual:
  # A question in another language is translated to English at the edge and the
  # answer translated back. Everything inside, the router, the SQL generator and
  # the cache, stays English so nothing downstream learns about language.
  enabled: true
  # Detection is a script test, so an English question costs no model call.
  # Turning this on routes every question through the translator instead, which
  # is what catches French or Indonesian at the cost of a call per question.
  always_translate: false
  answer_in_source_language: true

conversation:
  # A follow up is rewritten into a standalone question before routing, so the
  # router, the SQL generator and the cache all stay stateless.
  enabled: true
  # How many previous (question, answer) pairs the rewrite may look back over.
  # A reference reaches back a turn or two; a longer window costs prompt tokens
  # on every question and invites carrying over a filter the user has dropped.
  max_turns: 4

sql:
  allowed_tables:
    - floats
    - profiles
    - measurements
    # The second in-situ platform. Listed here so generated SQL may read the
    # drifting buoys, and so the validator rejects anything else as before.
    - drifters
    - drifter_observations
  model: "llama3.1:latest"
  default_limit: 500
  max_rows: 5000
  timeout_ms: 5000
  # Wall clock allowed for the model to produce SQL. A cold model load
  # can take most of this on its own.
  gen_timeout_seconds: 120

  # One more attempt at a query that failed, given the error it failed with.
  # Never applied to a refusal, and never when the error says the column does
  # not exist on the platform the query reads: that failure is the schema
  # answering the question, and a repair told to fix it will find something
  # else to put under the same alias.
  repair: true

semantic:
  # Natural-language summaries of what the measurements tables hold, one per
  # float and one per region, embedded with pgvector. They are read twice: as
  # context before SQL is written, so the model is not guessing what exists,
  # and as the corpus of the summaries route, which answers questions about
  # what the database holds with the float or region as the citation.
  enabled: true
  table: "data_summaries"
  top_k: 4
  # Below this cosine similarity a summary is noise in the prompt, not context.
  # bge-small scores unrelated text around 0.45, so a lower floor lets an
  # off-topic question pull in summaries that have nothing to do with it.
  min_similarity: 0.55

  # The summaries route declines below this confidence rather than calling
  # the model. Confidence is computed from the retrieval scores alone; see
  # src/semantic/confidence.py for how the three components combine.
  answer_threshold: 0.45
  confidence:
    weights:
      mean_similarity: 0.6
      support: 0.3
      spread: 0.1
    support_floor: 0.55

cache:
  enabled: true
  file: "data/cache/sql_cache.json"
  ttl_seconds: 604800

api:
  title: "FloatChat"
  cors_origins:
    - "*"

monitoring:
  log_file: "logs/interactions.jsonl"
  level: "INFO"
