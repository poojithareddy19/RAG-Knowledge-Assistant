# ============================================================================
# Production RAG Knowledge Assistant — central configuration
# ----------------------------------------------------------------------------
# Anything that changes system behaviour lives here.
# Secrets (API keys) belong in .env.
# ============================================================================

app:
  name: "Production RAG Knowledge Assistant"
  version: "0.1.0"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  vector_store_dir: "data/vector_store"
  log_dir: "logs"

ingestion:
  chunk_size: 1000
  chunk_overlap: 150
  min_chunk_chars: 40

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  normalize: true
  batch_size: 32
  device: "cpu"

vectorstore:
  backend: "pgvector"
  metric: "cosine"
  table: "doc_chunks"
  dimension: 384

retrieval:
  top_k: 5
  fetch_k: 20
  use_reranker: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

confidence:
  weights:
    mean_similarity: 0.6
    support: 0.3
    spread: 0.1
  support_floor: 0.35
  answer_threshold: 0.45

generation:
  provider: "ollama"
  model: "llama3.1:latest"
  temperature: 0.0
  max_tokens: 700
  expose_prompt: true

router:
  enabled: true
  model: "llama3.1:latest"
  fallback: "documents"
  max_rows: 5000
  timeout_ms: 5000

sql:
  allowed_tables:
    - floats
    - profiles
    - measurements
  model: "llama3.1:latest"
  default_limit: 500

cache:
  enabled: true
  file: "data/cache/sql_cache.json"
  ttl_seconds: 604800

api:
  title: "Grounded Data Assistant"
  cors_origins:
    - "*"

monitoring:
  log_file: "logs/interactions.jsonl"
  level: "INFO"