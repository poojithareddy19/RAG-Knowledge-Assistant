server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints its assets, so they can be cached hard. index.html
    # cannot: it is what points at the current fingerprints, and a cached copy
    # would keep serving the previous deploy's bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the service, which is what the dev server does with
    # its proxy config. Keeping the two arrangements equivalent means the
    # browser never needs CORS in either.
    #
    # The upstream is a variable, resolved per request through Docker's
    # embedded DNS, rather than a literal in proxy_pass. A literal is resolved
    # once at startup, and nginx refuses to start at all if the name is not
    # there yet: `host not found in upstream "api"`. That made the container
    # untestable on its own and meant a restarted API took the front end down
    # with it. With a variable the front end always serves, and /api answers
    # 502 for the seconds the service is away, which is the truthful state.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation is slow. The default 60s gateway timeout would cut off
        # answers the system would have produced, which is the same mistake
        # the evaluation harness was making against itself.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
