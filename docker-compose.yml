# Named explicitly rather than taken from the folder. Compose otherwise derives
# the project name from the directory, and prefixes every volume with it, so
# renaming or re-cloning the folder under another name silently pointed the app
# at a new, empty database while the real one sat unused in the old volume.
name: floatchat-argo-rag

services:
  db:
    # Built rather than pulled: this project needs pgvector for the embeddings
    # and PostGIS for the basin polygons, and no published image carries both.
    # See db/Dockerfile.
    build:
      context: ./db
    image: gda-postgis-pgvector:16
    container_name: gda_postgres
    environment:
      POSTGRES_USER: gda
      POSTGRES_PASSWORD: gda_local_pw
      POSTGRES_DB: gda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gda -d gda"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: gda_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE__URL: postgresql://gda:gda_local_pw@db:5432/gda
      DATABASE__READONLY_URL: postgresql://gda_ro:gda_ro_pw@db:5432/gda
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      GENERATION__PROVIDER: ollama
      GENERATION__MODEL: llama3.1:latest
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: